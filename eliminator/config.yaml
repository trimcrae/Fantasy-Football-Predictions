# User overrides. Anything here beats calibration.json and the code defaults.
# See eliminator/config.py for every key and its meaning.
season: null            # null = latest season present in the schedule feed
season_weeks: 18

# How the future is valued when choosing this week's pick (see BACKTEST.md).
#   policy: this week is the commitment (horizon 1); every later week is re-picked from the
#   best team still available at that scenario's closing line, in simulated seasons whose
#   spreads widen as real ones do. A pool of entries is re-split every week, so each entry
#   follows its own pattern later: spread_weights are how often it takes the best, second
#   and third team available to it. The season survival shown on the site is this number.
# Pool files (state/*.yaml): strikes is the loss that puts an entry out; strikes: 2 means the
# second loss eliminates, so the entry can lose once. 0 or 1 is single elimination.
planning:
  mode: policy
  horizon: 1
  spread_weights: [0.6, 0.3, 0.1]

model:
  ratings_source: auto  # auto -> inpredictable when reachable, else market-implied fit
  # planning.mode = discount only (the previous planner): how much to distrust future weeks
  # when choosing a fixed 18-week path. Kept for comparison; see BACKTEST.md.
  future_discount: 16
  # Week 18: in every simulated season the standings after week 17 decide who has nothing to
  # play for, and those teams are docked the points fitted in calibration.json (week18_rest:
  # about 10 for a clinched bye, 7 for a settled seed, 1 for an eliminated team). The residual
  # flattening and extra variance of week-18 lines come from calibration.json too.

qb:
  default_tier: average

simulation:
  # Season odds are scored exactly from each simulated season's lines (no coin flips), so
  # 50k seasons put the noise on a ~2% survival number well under 0.01 points and on the
  # 25-entry split well under that. The 25-entry plan takes a few minutes.
  scenarios: 50000
  seed: 7
