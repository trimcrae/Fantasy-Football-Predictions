# Weekly survivor-pool recommendations, published to GitHub Pages.
#
# Pages serves the master branch (root). Every run: refresh the nflverse feed, plan both
# pools, save the week's snapshot under eliminator/site/data/, render the site into picks/
# at the repository root, and commit all of that (plus any picks the pipeline filled in for
# games that have kicked off) back to master. GitHub's own Pages build then publishes it at
# https://<owner>.github.io/<repo>/picks/ ; the root index.html forwards there.
name: Eliminator picks site

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "eliminator/**"
      - ".github/workflows/eliminator-pages.yml"
  schedule:
    # Times are UTC. ET is UTC-4 until early November, then UTC-5.
    - cron: "0 13 * * *"    # every morning ~9 ET: fresh lines, Tuesday picks up Monday-night results
    - cron: "0 22 * * 4"    # Thursday ~6 ET, before Thursday night kickoff
    - cron: "30 15 * * 0"   # Sunday ~11:30 ET, before the early window

permissions:
  contents: write

concurrency:
  group: eliminator-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eliminator/requirements.txt

      - name: Install
        run: pip install -r eliminator/requirements.txt

      - name: Snapshot this week's recommendations
        working-directory: eliminator
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m eliminator snapshot

      - name: Render site into picks/
        working-directory: eliminator
        run: |
          rm -rf ../picks
          python -m eliminator site --offline --out ../picks
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=picks/"><title>Eliminator picks</title><p><a href="picks/">Eliminator picks</a></p>\n' > ../index.html
          touch ../.nojekyll

      - name: Commit snapshot, filled-in picks and the rendered site
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eliminator/site/data eliminator/state picks index.html .nojekyll
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "eliminator: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            # master may have moved during the run; everything this commit touches is regenerated
            # every run, so on conflict keep this run's files (the replayed commit is "theirs")
            for attempt in 1 2 3; do
              git fetch origin master
              if ! git rebase origin/master; then
                git checkout --theirs -- picks eliminator/site/data eliminator/state index.html .nojekyll 2>/dev/null || true
                git add -A picks eliminator/site/data eliminator/state index.html .nojekyll
                GIT_EDITOR=true git rebase --continue
              fi
              if git push origin HEAD:master; then break; fi
              echo "push rejected (attempt $attempt), retrying"; sleep 10
            done
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Pages build of that commit and check the live page
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/picks/"
          for i in $(seq 1 30); do
            latest=$(curl -sS "${hdr[@]}" "$api/builds/latest" || true)
            status=$(echo "$latest" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("status",""), d.get("commit",""))' 2>/dev/null || echo "? ?")
            echo "pages build: $status (want built $SHA)"
            if [ "$status" = "built $SHA" ]; then break; fi
            sleep 10
          done
          for i in 1 2 3 4 5 6; do
            if curl -sSL "$url" | grep -q "<title>Eliminator picks"; then
              echo "ok: $url serves the eliminator site"; exit 0
            fi
            echo "attempt $i: not there yet"; sleep 15
          done
          echo "::error::$url is not serving the eliminator site yet. Pages must be set to deploy from branch master, folder / (root)."
          exit 1
