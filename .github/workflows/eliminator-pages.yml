# Weekly survivor-pool recommendations, published to GitHub Pages.
#
# Pages serves the master branch (root). Every run: refresh the nflverse feed, plan both
# pools, save the week's snapshot under eliminator/site/data/, render the site into picks/
# at the repository root, and commit all of that (plus any picks the pipeline filled in for
# games that have kicked off) back to master. GitHub's own Pages build then publishes it at
# https://<owner>.github.io/<repo>/picks/ ; the root index.html forwards there.
name: Eliminator picks site

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "eliminator/**"
      - ".github/workflows/eliminator-pages.yml"
  schedule:
    # Times are UTC. ET is UTC-4 until early November, then UTC-5.
    #
    # GitHub does not start scheduled runs on time: this workflow's slots have been starting
    # 1.5-4 hours late (the 13:00 UTC slot at 15:40-17:00 UTC, the Sunday 15:30 slot at
    # 17:37 UTC, i.e. after the 1pm ET kickoffs). Every game-day slot below is therefore
    # scheduled hours before the time we actually need the picks, and Sunday gets several
    # slots so that at least one lands before 9am ET (the earliest Sunday kickoff, a London
    # game, is 9:30 ET) and the latest of them carries the freshest lines. Off-the-hour
    # minutes are used because the :00 slots are the most congested. Extra runs are cheap:
    # each is idempotent and only adds a revision to the week's snapshot.
    - cron: "23 13 * * *"   # every day, nominally ~9 ET: fresh lines, Tuesday picks up Monday-night results
    - cron: "23 20 * * 4"   # Thursday, nominally ~4:30 ET, lands well before the 8:15 ET kickoff
    - cron: "23 7 * * 0"    # Sunday, nominally ~3:30 ET: lands by ~7:30 ET even 4 hours late
    - cron: "23 9 * * 0"    # Sunday, nominally ~5:30 ET: lands by ~9 ET up to 3.5 hours late
    - cron: "23 11 * * 0"   # Sunday, nominally ~7:30 ET: the fresh pre-9am lines when it runs on time
    - cron: "23 14 * * 0"   # Sunday, nominally ~10:30 ET: last refresh before the early window

permissions:
  contents: write

concurrency:
  group: eliminator-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: How late is this scheduled run?
        if: github.event_name == 'schedule'
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime as dt, os
          minute, hour = (int(x) for x in os.environ["CRON"].split()[:2])
          now = dt.datetime.now(dt.timezone.utc)
          slot = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
          if slot > now:
              slot -= dt.timedelta(days=1)
          late = (now - slot).total_seconds() / 60
          print(f"slot '{os.environ['CRON']}' = {slot:%Y-%m-%d %H:%M} UTC; started {now:%H:%M} UTC, {late:.0f} min late")
          if late > 120:
              print(f"::warning::scheduled run started {late:.0f} minutes after its {slot:%H:%M} UTC slot")
          PY

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eliminator/requirements.txt

      - name: Install
        run: pip install -r eliminator/requirements.txt

      - name: Snapshot this week's recommendations
        working-directory: eliminator
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m eliminator snapshot

      - name: Render site into picks/
        working-directory: eliminator
        run: |
          rm -rf ../picks
          python -m eliminator site --offline --out ../picks
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=picks/"><title>Eliminator picks</title><p><a href="picks/">Eliminator picks</a></p>\n' > ../index.html
          touch ../.nojekyll

      - name: Commit snapshot, filled-in picks and the rendered site
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eliminator/site/data eliminator/state picks index.html .nojekyll
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "eliminator: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            # master may have moved during the run; everything this commit touches is regenerated
            # every run, so on conflict keep this run's files (the replayed commit is "theirs")
            for attempt in 1 2 3; do
              git fetch origin master
              if ! git rebase origin/master; then
                git checkout --theirs -- picks eliminator/site/data eliminator/state index.html .nojekyll 2>/dev/null || true
                git add -A picks eliminator/site/data eliminator/state index.html .nojekyll
                GIT_EDITOR=true git rebase --continue
              fi
              if git push origin HEAD:master; then break; fi
              echo "push rejected (attempt $attempt), retrying"; sleep 10
            done
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Pages build of that commit and check the live page
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/picks/"
          for i in $(seq 1 30); do
            latest=$(curl -sS "${hdr[@]}" "$api/builds/latest" || true)
            status=$(echo "$latest" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("status",""), d.get("commit",""))' 2>/dev/null || echo "? ?")
            echo "pages build: $status (want built $SHA)"
            if [ "$status" = "built $SHA" ]; then break; fi
            sleep 10
          done
          for i in 1 2 3 4 5 6; do
            if curl -sSL "$url" | grep -q "<title>Eliminator picks"; then
              echo "ok: $url serves the eliminator site"; exit 0
            fi
            echo "attempt $i: not there yet"; sleep 15
          done
          echo "::error::$url is not serving the eliminator site yet. Pages must be set to deploy from branch master, folder / (root)."
          exit 1
